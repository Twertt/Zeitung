<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeitung Austragen - Raunheim</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #info-box { background: #1e293b; color: white; padding: 15px; text-align: center; z-index: 1000; }
    #next-step { font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; color: #facc15; }
    #confirm-btn { background: #16a34a; color: white; border: none; padding: 14px 20px; font-size: 1rem; border-radius: 8px; width: 100%; max-width: 300px; font-weight: bold; cursor: pointer; }
    #confirm-btn:active { background: #15803d; }
    #map { flex: 1; width: 100%; }
  </style>
</head>
<body>

  <div id="info-box">
    <div id="next-step">Klicke unten zum Starten</div>
    <button id="confirm-btn" onclick="nextWaypoint()">Route Starten / Weiter ➔</button>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Exakte Koordinaten für Raunheim West (Ringstraße / Oderstraße)
    const waypoints = [
      { name: "Start: Ringstraße 57", lat: 50.01210, lng: 8.44420 },
      { name: "1. Ringstraße Hnr. 56 bis 70", lat: 50.01230, lng: 8.44440 },
      { name: "2. Oderstraße Hnr. 1 bis 73", lat: 50.01340, lng: 8.44350 },
      { name: "3. Moselstraße Hnr. 1 bis 11, 13 bis 14 und 18 bis 22", lat: 50.01370, lng: 8.44460 },
      { name: "4. Aussiger Straße Hnr. 1 bis 18 und 20 bis 22", lat: 50.01420, lng: 8.44550 },
      { name: "5. Jakobstraße Hnr. 48 bis 52", lat: 50.01380, lng: 8.44630 },
      { name: "6. Ringstraße Hnr. 72 bis 122", lat: 50.01290, lng: 8.44520 },
      { name: "Ziel erreicht! Wieder Zuhause.", lat: 50.01210, lng: 8.44420 }
    ];

    let currentStep = -1;
    let map, userMarker, targetMarker;
    let speechSynth = window.speechSynthesis;

    function initMap() {
      // Zentrierung exakt auf dein Wohngebiet
      map = L.map('map').setView([50.01250, 8.44450], 17);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      startGPS();
    }

    function startGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;

            if (!userMarker) {
              userMarker = L.circleMarker([lat, lng], {
                color: '#1d4ed8',
                fillColor: '#3b82f6',
                fillOpacity: 0.9,
                radius: 9
              }).addTo(map).bindPopup("Dein Standort");
            } else {
              userMarker.setLatLng([lat, lng]);
            }
          },
          (err) => console.log("GPS Suche..."),
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
      }
    }

    function speak(text) {
      if (speechSynth) {
        speechSynth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'de-DE';
        speechSynth.speak(utterance);
      }
    }

    function nextWaypoint() {
      if (currentStep < waypoints.length - 1) {
        currentStep++;
        const point = waypoints[currentStep];

        document.getElementById('next-step').innerText = point.name;
        speak(point.name);

        if (targetMarker) map.removeLayer(targetMarker);
        targetMarker = L.marker([point.lat, point.lng]).addTo(map).bindPopup(point.name).openPopup();

        map.setView([point.lat, point.lng], 17);
      }
    }

    window.onload = initMap;
  </script>
</body>
</html>
