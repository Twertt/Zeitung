<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeitung Austragen - Raunheim Route</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #info-box { background: #1e293b; color: white; padding: 15px; text-align: center; z-index: 1000; }
    #next-step { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; color: #facc15; }
    #progress { font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px; }
    #confirm-btn { background: #16a34a; color: white; border: none; padding: 14px 20px; font-size: 1.1rem; border-radius: 8px; width: 100%; max-width: 320px; font-weight: bold; cursor: pointer; }
    #confirm-btn:disabled { background: #475569; cursor: not-allowed; }
    #map { flex: 1; width: 100%; }
    #reset-btn { background: transparent; color: #64748b; border: none; font-size: 0.75rem; text-decoration: underline; margin-top: 5px; cursor: pointer; }
  </style>
</head>
<body>

  <div id="info-box">
    <div id="next-step">Initialisiere Route...</div>
    <div id="progress">Lade GPS-Daten...</div>
    <button id="confirm-btn" onclick="nextWaypoint()" disabled>Bitte warten...</button>
    <div><button id="reset-btn" onclick="clearCache()">Karte neu laden / Cache leeren</button></div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, userMarker, targetMarker;
    let speechSynth = window.speechSynthesis;
    let waypoints = [];
    let currentStep = -1;

    // Exakte Raunheimer Adress-Auffindung
    const routeSegments = [
      { type: 'single', name: 'Start: Ringstraße 57', query: 'Ringstraße 57, 65479 Raunheim' },
      { type: 'range', street: 'Ringstraße', nums: makeRange(56, 70, 2), startQuery: 'Ringstraße 56, 65479 Raunheim', endQuery: 'Ringstraße 70, 65479 Raunheim' },
      { type: 'range', street: 'Oderstraße', nums: makeRange(1, 73, 2), startQuery: 'Oderstraße 1, 65479 Raunheim', endQuery: 'Oderstraße 73, 65479 Raunheim' },
      { type: 'range', street: 'Oderstraße', nums: makeRange(72, 2, 2), startQuery: 'Oderstraße 72, 65479 Raunheim', endQuery: 'Oderstraße 2, 65479 Raunheim' },
      { type: 'range', street: 'Moselstraße', nums: [1,3,5,7,9,11,13,19,21], startQuery: 'Moselstraße 1, 65479 Raunheim', endQuery: 'Moselstraße 21, 65479 Raunheim' },
      { type: 'range', street: 'Moselstraße', nums: [22,20,18,14,10,8,6,4,2], startQuery: 'Moselstraße 22, 65479 Raunheim', endQuery: 'Moselstraße 2, 65479 Raunheim' },
      { type: 'range', street: 'Aussiger Straße', nums: [1,3,5,7,9,11,13,15,17,21], startQuery: 'Aussiger Straße 1, 65479 Raunheim', endQuery: 'Aussiger Straße 21, 65479 Raunheim' },
      { type: 'range', street: 'Aussiger Straße', nums: [22,20,18,16,14,12,10,8,6,4,2], startQuery: 'Aussiger Straße 22, 65479 Raunheim', endQuery: 'Aussiger Straße 2, 65479 Raunheim' },
      { type: 'range', street: 'Jakobstraße', nums: makeRange(48, 52, 1), startQuery: 'Jakobstraße 48, 65479 Raunheim', endQuery: 'Jakobstraße 52, 65479 Raunheim' },
      { type: 'range', street: 'Ringstraße', nums: makeRange(72, 122, 2), startQuery: 'Ringstraße 72, 65479 Raunheim', endQuery: 'Ringstraße 122, 65479 Raunheim' },
      { type: 'single', name: 'Ziel erreicht! Wieder Zuhause.', query: 'Ringstraße 57, 65479 Raunheim' }
    ];

    function makeRange(start, end, step = 1) {
      const res = [];
      if (start <= end) {
        for (let i = start; i <= end; i += step) res.push(i);
      } else {
        for (let i = start; i >= end; i -= step) res.push(i);
      }
      return res;
    }

    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    async function fetchOSMCoords(query) {
      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;
        const res = await fetch(url, { headers: { 'Accept-Language': 'de' } });
        const data = await res.json();
        if (data && data.length > 0) {
          return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
        }
      } catch(e) { console.error(e); }
      return null;
    }

    async function loadRoute() {
      const cached = localStorage.getItem('raunheim_route_v2');
      if (cached) {
        waypoints = JSON.parse(cached);
        enableApp();
        return;
      }

      document.getElementById('next-step').innerText = "Echte GPS-Daten werden ermittelt...";
      const totalQueries = routeSegments.reduce((acc, s) => acc + (s.type === 'single' ? 1 : 2), 0);
      let currentQuery = 0;

      waypoints = [];

      for (const seg of routeSegments) {
        if (seg.type === 'single') {
          currentQuery++;
          document.getElementById('progress').innerText = `Prüfe Adressen (${currentQuery}/${totalQueries})...`;
          const coords = await fetchOSMCoords(seg.query);
          await sleep(750);
          if (coords) waypoints.push({ name: seg.name, lat: coords.lat, lng: coords.lng });
        } else {
          currentQuery++;
          document.getElementById('progress').innerText = `Prüfe Adressen (${currentQuery}/${totalQueries})...`;
          const startCoords = await fetchOSMCoords(seg.startQuery);
          await sleep(750);

          currentQuery++;
          document.getElementById('progress').innerText = `Prüfe Adressen (${currentQuery}/${totalQueries})...`;
          const endCoords = await fetchOSMCoords(seg.endQuery);
          await sleep(750);

          if (startCoords && endCoords) {
            const count = seg.nums.length;
            seg.nums.forEach((num, idx) => {
              const t = count > 1 ? idx / (count - 1) : 0;
              waypoints.push({
                name: `${seg.street} ${num}`,
                lat: startCoords.lat + t * (endCoords.lat - startCoords.lat),
                lng: startCoords.lng + t * (endCoords.lng - startCoords.lng)
              });
            });
          }
        }
      }

      localStorage.setItem('raunheim_route_v2', JSON.stringify(waypoints));
      enableApp();
    }

    function enableApp() {
      const btn = document.getElementById('confirm-btn');
      btn.disabled = false;
      btn.innerText = "Route Starten / Weiter ➔";
      document.getElementById('next-step').innerText = "Bereit zum Starten!";
      document.getElementById('progress').innerText = `${waypoints.length} Haltepunkte bereit`;
      
      if (waypoints.length > 0) {
        map.setView([waypoints[0].lat, waypoints[0].lng], 18);
      }
    }

    function clearCache() {
      localStorage.removeItem('raunheim_route_v2');
      location.reload();
    }

    function initMap() {
      map = L.map('map').setView([50.0145, 8.4440], 18);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      startGPS();
      loadRoute();
    }

    function startGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;

            if (!userMarker) {
              userMarker = L.circleMarker([lat, lng], {
                color: '#1d4ed8',
                fillColor: '#3b82f6',
                fillOpacity: 0.9,
                radius: 9
              }).addTo(map).bindPopup("Dein Standort");
            } else {
              userMarker.setLatLng([lat, lng]);
            }
          },
          (err) => console.log("GPS..."),
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
      }
    }

    function speak(text) {
      if (speechSynth) {
        speechSynth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'de-DE';
        speechSynth.speak(utterance);
      }
    }

    function nextWaypoint() {
      if (currentStep < waypoints.length - 1) {
        currentStep++;
        const item = waypoints[currentStep];

        document.getElementById('next-step').innerText = item.name;
        document.getElementById('progress').innerText = `Haus ${currentStep + 1} von ${waypoints.length}`;
        speak(item.name);

        if (targetMarker) map.removeLayer(targetMarker);
        
        targetMarker = L.marker([item.lat, item.lng]).addTo(map).bindPopup(item.name).openPopup();
        map.setView([item.lat, item.lng], 18);
      }
    }

    window.onload = initMap;
  </script>
</body>
</html>
