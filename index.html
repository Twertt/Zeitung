<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeitung Austragen - Effizienter Laufweg</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #info-box { background: #1e293b; color: white; padding: 15px; text-align: center; z-index: 1000; }
    #next-step { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; color: #facc15; }
    #progress { font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px; }
    #confirm-btn { background: #16a34a; color: white; border: none; padding: 14px 20px; font-size: 1.1rem; border-radius: 8px; width: 100%; max-width: 320px; font-weight: bold; cursor: pointer; }
    #confirm-btn:active { background: #15803d; }
    #map { flex: 1; width: 100%; }
  </style>
</head>
<body>

  <div id="info-box">
    <div id="next-step">Klicke unten zum Starten</div>
    <div id="progress">Bereit zur Austragung</div>
    <button id="confirm-btn" onclick="nextWaypoint()">Route Starten / Weiter ➔</button>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    function buildList(street, numbers) {
      return numbers.map(num => ({ name: `${street} ${num}` }));
    }

    function makeRange(start, end, step = 1) {
      const res = [];
      if (start <= end) {
        for (let i = start; i <= end; i += step) res.push(i);
      } else {
        for (let i = start; i >= end; i -= step) res.push(i);
      }
      return res;
    }

    // Perfekt geordnete Route: Erst eine Seite hoch, dann die andere zurück
    const addressList = [
      { name: "Start: Ringstraße 57" },

      // 1. Ringstraße (56 -> 70, nur gerade)
      ...buildList("Ringstraße", makeRange(56, 70, 2)),

      // 2. Oderstraße: Erst UNGERADE hoch (1 -> 73), dann GERADE zurück (72 -> 2)
      ...buildList("Oderstraße", makeRange(1, 73, 2)),
      ...buildList("Oderstraße", makeRange(72, 2, 2)),

      // 3. Moselstraße: UNGERADE hin (1 -> 21), GERADE zurück (22 -> 2)
      ...buildList("Moselstraße", [1, 3, 5, 7, 9, 11, 13, 19, 21]),
      ...buildList("Moselstraße", [22, 20, 18, 14, 10, 8, 6, 4, 2]),

      // 4. Aussiger Straße: UNGERADE hin (1 -> 21), GERADE zurück (22 -> 2)
      ...buildList("Aussiger Straße", [1, 3, 5, 7, 9, 11, 13, 15, 17, 21]),
      ...buildList("Aussiger Straße", [22, 20, 18, 16, 14, 12, 10, 8, 6, 4, 2]),

      // 5. Jakobstraße (48 -> 52)
      ...buildList("Jakobstraße", makeRange(48, 52, 1)),

      // 6. Ringstraße (72 -> 122, nur gerade zurück nach Hause)
      ...buildList("Ringstraße", makeRange(72, 122, 2)),

      { name: "Ziel erreicht! Wieder Zuhause." }
    ];

    // Feste Orientierungspunkte für Kartenausschnitte (kein Aufhängen mehr)
    const areaCoords = {
      "Ringstraße": [50.0125, 8.4445],
      "Oderstraße": [50.0131, 8.4431],
      "Moselstraße": [50.0136, 8.4442],
      "Aussiger Straße": [50.0139, 8.4451],
      "Jakobstraße": [50.0136, 8.4459]
    };

    let currentStep = -1;
    let map, userMarker, targetMarker;
    let speechSynth = window.speechSynthesis;

    function initMap() {
      map = L.map('map').setView([50.0125, 8.4445], 18);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      startGPS();
    }

    function startGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;

            if (!userMarker) {
              userMarker = L.circleMarker([lat, lng], {
                color: '#1d4ed8',
                fillColor: '#3b82f6',
                fillOpacity: 0.9,
                radius: 9
              }).addTo(map).bindPopup("Dein Standort");
            } else {
              userMarker.setLatLng([lat, lng]);
            }
          },
          (err) => console.log("GPS..."),
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
      }
    }

    function speak(text) {
      if (speechSynth) {
        speechSynth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'de-DE';
        speechSynth.speak(utterance);
      }
    }

    function nextWaypoint() {
      if (currentStep < addressList.length - 1) {
        currentStep++;
        const item = addressList[currentStep];

        document.getElementById('next-step').innerText = item.name;
        document.getElementById('progress').innerText = `Haus ${currentStep + 1} von ${addressList.length}`;
        speak(item.name);

        // Passt den Kartenausschnitt flüssig an die jeweilige Straße an
        for (let street in areaCoords) {
          if (item.name.includes(street)) {
            map.setView(areaCoords[street], 18);
            break;
          }
        }
      }
    }

    window.onload = initMap;
  </script>
</body>
</html>
