<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeitung Austragen - Raunheim Route</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #info-box { background: #1e293b; color: white; padding: 15px; text-align: center; z-index: 1000; }
    #next-step { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; color: #facc15; }
    #progress { font-size: 0.85rem; color: #94a3b8; margin-bottom: 12px; }
    .btn-group { display: flex; gap: 10px; justify-content: center; width: 100%; max-width: 360px; margin: 0 auto; }
    .nav-btn { flex: 1; padding: 14px 10px; font-size: 1rem; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; color: white; }
    #prev-btn { background: #475569; }
    #prev-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    #next-btn { background: #16a34a; }
    #next-btn:disabled { background: #475569; cursor: not-allowed; }
    #map { flex: 1; width: 100%; }
    #reset-btn { background: transparent; color: #64748b; border: none; font-size: 0.75rem; text-decoration: underline; margin-top: 8px; cursor: pointer; }
  </style>
</head>
<body>

  <div id="info-box">
    <div id="next-step">Lade Gebäude-Koordinaten...</div>
    <div id="progress">Bitte einen Moment Geduld</div>
    <div class="btn-group">
      <button id="prev-btn" class="nav-btn" onclick="prevWaypoint()" disabled>⬅ Zurück</button>
      <button id="next-btn" class="nav-btn" onclick="nextWaypoint()" disabled>Weiter ➔</button>
    </div>
    <div><button id="reset-btn" onclick="clearRouteCache()">Daten neu laden</button></div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, userMarker, targetMarker;
    let speechSynth = window.speechSynthesis;
    let waypoints = [];
    let currentStep = -1;

    // Manuelle Korrekturen für Hausnummern, die in OSM fehlen oder ungenau platziert sind
    const manualOverrides = {
      "oderstr|61": { lat: 50.01785, lng: 8.44310 },
      "oderstr|63": { lat: 50.01793, lng: 8.44315 },
      "oderstr|65": { lat: 50.01801, lng: 8.44320 },
      "oderstr|67": { lat: 50.01809, lng: 8.44325 }
    };

    // Gewünschte Austrag-Reihenfolge
    const deliveryPlan = [
      { street: "Ringstraße", nums: [57] },
      { street: "Ringstraße", nums: makeRange(56, 70, 2) },
      { street: "Oderstraße", nums: makeRange(1, 73, 2) },
      { street: "Oderstraße", nums: makeRange(72, 2, 2) },
      { street: "Moselstraße", nums: [1,3,5,7,9,11,13,19,21] },
      { street: "Moselstraße", nums: [22,20,18,14,10,8,6,4,2] },
      { street: "Aussiger Straße", nums: [1,3,5,7,9,11,13,15,17,21] },
      { street: "Aussiger Straße", nums: [22,20,18,16,14,12,10,8,6,4,2] },
      { street: "Jakobstraße", nums: makeRange(48, 52, 1) },
      { street: "Ringstraße", nums: makeRange(72, 122, 2) },
      { street: "Ringstraße", nums: [57] }
    ];

    function makeRange(start, end, step = 1) {
      const res = [];
      if (start <= end) {
        for (let i = start; i <= end; i += step) res.push(i);
      } else {
        for (let i = start; i >= end; i -= step) res.push(i);
      }
      return res;
    }

    function cleanStreet(str) {
      return str.toLowerCase().replace(/straße/g, "str").replace(/strasse/g, "str").replace(/\s+/g, "");
    }

    async function loadRouteData() {
      const cached = localStorage.getItem('raunheim_exact_route_v4');
      if (cached) {
        waypoints = JSON.parse(cached);
        startApp();
        return;
      }

      document.getElementById('next-step').innerText = "Rufe echte Haus-Standorte ab...";
      document.getElementById('progress').innerText = "Verbindung zu OpenStreetMap...";

      const overpassQuery = `
        [out:json][timeout:25];
        area["postal_code"="65479"]->.a;
        (
          node["addr:street"]["addr:housenumber"](area.a);
          way["addr:street"]["addr:housenumber"](area.a);
        );
        out center;
      `;

      try {
        const response = await fetch("https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(overpassQuery));
        const data = await response.json();

        const osmMap = {};
        data.elements.forEach(el => {
          const st = el.tags?.['addr:street'];
          const hn = parseInt(el.tags?.['addr:housenumber'], 10);
          const lat = el.lat || el.center?.lat;
          const lng = el.lon || el.center?.lon;

          if (st && !isNaN(hn) && lat && lng) {
            const key = cleanStreet(st);
            if (!osmMap[key]) osmMap[key] = {};
            osmMap[key][hn] = { lat: Number(lat.toFixed(6)), lng: Number(lng.toFixed(6)) };
          }
        });

        buildExactWaypoints(osmMap);
      } catch (err) {
        document.getElementById('next-step').innerText = "Netzwerkfehler beim Laden!";
        document.getElementById('progress').innerText = "Bitte Seite neu laden.";
      }
    }

    function buildExactWaypoints(osmMap) {
      waypoints = [];

      deliveryPlan.forEach(section => {
        const sKey = cleanStreet(section.street);
        const streetMap = osmMap[sKey] || {};

        section.nums.forEach(num => {
          let coords = null;
          const overrideKey = `${sKey}|${num}`;

          // 1. Priorität: Manuelle Exakt-Korrektur
          if (manualOverrides[overrideKey]) {
            coords = manualOverrides[overrideKey];
          } 
          // 2. Priorität: Exakter Treffer aus OpenStreetMap
          else if (streetMap[num]) {
            coords = streetMap[num];
          } 
          // 3. Priorität: Interpolation zwischen direkten Nachbarn der Straße
          else {
            const knownNums = Object.keys(streetMap).map(Number).sort((a,b) => a - b);
            let lower = null, higher = null;

            for (let n of knownNums) {
              if (n < num) lower = n;
              if (n > num && higher === null) higher = n;
            }

            if (lower !== null && higher !== null) {
              const t = (num - lower) / (higher - lower);
              coords = {
                lat: Number((streetMap[lower].lat + t * (streetMap[higher].lat - streetMap[lower].lat)).toFixed(6)),
                lng: Number((streetMap[lower].lng + t * (streetMap[higher].lng - streetMap[lower].lng)).toFixed(6))
              };
            } else if (lower !== null) {
              coords = streetMap[lower];
            } else if (higher !== null) {
              coords = streetMap[higher];
            } else {
              coords = { lat: 50.0145, lng: 8.4440 };
            }
          }

          const label = (num === 57 && section.nums.length === 1 && waypoints.length > 0) 
            ? "Ziel erreicht! Wieder Zuhause." 
            : `${section.street} ${num}`;

          waypoints.push({ name: label, lat: coords.lat, lng: coords.lng });
        });
      });

      localStorage.setItem('raunheim_exact_route_v4', JSON.stringify(waypoints));
      startApp();
    }

    function startApp() {
      const nextBtn = document.getElementById('next-btn');
      nextBtn.disabled = false;
      document.getElementById('next-step').innerText = "Bereit zum Starten!";
      document.getElementById('progress').innerText = `${waypoints.length} Hausnummern bereit`;

      if (waypoints.length > 0) {
        map.setView([waypoints[0].lat, waypoints[0].lng], 18);
      }
    }

    function clearRouteCache() {
      localStorage.removeItem('raunheim_exact_route_v4');
      location.reload();
    }

    function initMap() {
      map = L.map('map').setView([50.0145, 8.4440], 18);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      startGPS();
      loadRouteData();
    }

    function startGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;

            if (!userMarker) {
              userMarker = L.circleMarker([lat, lng], {
                color: '#1d4ed8',
                fillColor: '#3b82f6',
                fillOpacity: 0.9,
                radius: 9
              }).addTo(map).bindPopup("Dein Standort");
            } else {
              userMarker.setLatLng([lat, lng]);
            }
          },
          (err) => console.log("GPS..."),
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
      }
    }

    function speak(text) {
      if (speechSynth) {
        speechSynth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'de-DE';
        speechSynth.speak(utterance);
      }
    }

    function updateWaypointUI() {
      if (currentStep < 0 || currentStep >= waypoints.length) return;

      const item = waypoints[currentStep];

      document.getElementById('next-step').innerText = item.name;
      document.getElementById('progress').innerText = `Station ${currentStep + 1} von ${waypoints.length}`;
      speak(item.name);

      if (targetMarker) map.removeLayer(targetMarker);
      
      targetMarker = L.marker([item.lat, item.lng]).addTo(map).bindPopup(item.name).openPopup();
      map.setView([item.lat, item.lng], 18);

      document.getElementById('prev-btn').disabled = (currentStep <= 0);
      document.getElementById('next-btn').disabled = (currentStep >= waypoints.length - 1);
    }

    function nextWaypoint() {
      if (currentStep < waypoints.length - 1) {
        currentStep++;
        updateWaypointUI();
      }
    }

    function prevWaypoint() {
      if (currentStep > 0) {
        currentStep--;
        updateWaypointUI();
      }
    }

    window.onload = initMap;
  </script>
</body>
</html>
