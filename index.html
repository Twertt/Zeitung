<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeitung Austragen - Raunheim Nord/West</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #info-box { background: #1e293b; color: white; padding: 15px; text-align: center; z-index: 1000; }
    #next-step { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; color: #facc15; }
    #progress { font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px; }
    #confirm-btn { background: #16a34a; color: white; border: none; padding: 14px 20px; font-size: 1.1rem; border-radius: 8px; width: 100%; max-width: 320px; font-weight: bold; cursor: pointer; }
    #confirm-btn:active { background: #15803d; }
    #map { flex: 1; width: 100%; }
  </style>
</head>
<body>

  <div id="info-box">
    <div id="next-step">Klicke unten zum Starten</div>
    <div id="progress">Bereit zur Austragung</div>
    <button id="confirm-btn" onclick="nextWaypoint()">Route Starten / Weiter ➔</button>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Berechnet flüssige GPS-Punkte entlang der echten Straßen im Viertel
    function buildInterpolatedRoute(street, numbers, startLat, startLng, endLat, endLng) {
      const count = numbers.length;
      return numbers.map((num, idx) => {
        const t = count > 1 ? idx / (count - 1) : 0;
        const lat = startLat + t * (endLat - startLat);
        const lng = startLng + t * (endLng - startLng);
        return {
          name: `${street} ${num}`,
          lat: Number(lat.toFixed(6)),
          lng: Number(lng.toFixed(6))
        };
      });
    }

    function makeRange(start, end, step = 1) {
      const res = [];
      if (start <= end) {
        for (let i = start; i <= end; i += step) res.push(i);
      } else {
        for (let i = start; i >= end; i -= step) res.push(i);
      }
      return res;
    }

    // Exakte Viertel-Koordinaten (Raunheim Nord-West: Ringstraße, Oderstraße, Moselstraße)
    const addressList = [
      { name: "Start: Ringstraße 57", lat: 50.01630, lng: 8.44350 },

      // 1. Ringstraße Hnr. 56 -> 70 (gerade)
      ...buildInterpolatedRoute("Ringstraße", makeRange(56, 70, 2), 50.01640, 8.44380, 50.01680, 8.44460),

      // 2. Oderstraße: Ungerade hoch (1 -> 73)
      ...buildInterpolatedRoute("Oderstraße", makeRange(1, 73, 2), 50.01670, 8.44250, 50.01820, 8.44320),
      // Oderstraße: Gerade zurück (72 -> 2)
      ...buildInterpolatedRoute("Oderstraße", makeRange(72, 2, 2), 50.01822, 8.44340, 50.01672, 8.44270),

      // 3. Moselstraße: Ungerade hin (1 -> 21)
      ...buildInterpolatedRoute("Moselstraße", [1, 3, 5, 7, 9, 11, 13, 19, 21], 50.01700, 8.44360, 50.01800, 8.44440),
      // Moselstraße: Gerade zurück (22 -> 2)
      ...buildInterpolatedRoute("Moselstraße", [22, 20, 18, 14, 10, 8, 6, 4, 2], 50.01802, 8.44460, 50.01702, 8.44380),

      // 4. Aussiger Straße: Ungerade hin (1 -> 21)
      ...buildInterpolatedRoute("Aussiger Straße", [1, 3, 5, 7, 9, 11, 13, 15, 17, 21], 50.01730, 8.44460, 50.01820, 8.44540),
      // Aussiger Straße: Gerade zurück (22 -> 2)
      ...buildInterpolatedRoute("Aussiger Straße", [22, 20, 18, 16, 14, 12, 10, 8, 6, 4, 2], 50.01822, 8.44560, 50.01732, 8.44480),

      // 5. Jakobstraße (48 -> 52)
      ...buildInterpolatedRoute("Jakobstraße", makeRange(48, 52, 1), 50.01650, 8.44580, 50.01690, 8.44640),

      // 6. Ringstraße (72 -> 122, gerade zurück nach Hause)
      ...buildInterpolatedRoute("Ringstraße", makeRange(72, 122, 2), 50.01680, 8.44500, 50.01620, 8.44380),

      { name: "Ziel erreicht! Wieder Zuhause.", lat: 50.01630, lng: 8.44350 }
    ];

    let currentStep = -1;
    let map, userMarker, targetMarker;
    let speechSynth = window.speechSynthesis;

    function initMap() {
      map = L.map('map').setView([50.01630, 8.44350], 18);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      startGPS();
    }

    function startGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;

            if (!userMarker) {
              userMarker = L.circleMarker([lat, lng], {
                color: '#1d4ed8',
                fillColor: '#3b82f6',
                fillOpacity: 0.9,
                radius: 9
              }).addTo(map).bindPopup("Dein Standort");
            } else {
              userMarker.setLatLng([lat, lng]);
            }
          },
          (err) => console.log("GPS..."),
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
      }
    }

    function speak(text) {
      if (speechSynth) {
        speechSynth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'de-DE';
        speechSynth.speak(utterance);
      }
    }

    function nextWaypoint() {
      if (currentStep < addressList.length - 1) {
        currentStep++;
        const item = addressList[currentStep];

        document.getElementById('next-step').innerText = item.name;
        document.getElementById('progress').innerText = `Haus ${currentStep + 1} von ${addressList.length}`;
        speak(item.name);

        if (targetMarker) map.removeLayer(targetMarker);
        
        targetMarker = L.marker([item.lat, item.lng]).addTo(map).bindPopup(item.name).openPopup();
        map.setView([item.lat, item.lng], 18);
      }
    }

    window.onload = initMap;
  </script>
</body>
</html>
