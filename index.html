<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeitung Austragen - Kürzester Weg</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #info-box { background: #1e293b; color: white; padding: 15px; text-align: center; z-index: 1000; }
    #next-step { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; color: #facc15; }
    #progress { font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px; }
    #confirm-btn { background: #16a34a; color: white; border: none; padding: 14px 20px; font-size: 1.1rem; border-radius: 8px; width: 100%; max-width: 320px; font-weight: bold; cursor: pointer; }
    #confirm-btn:active { background: #15803d; }
    #map { flex: 1; width: 100%; }
  </style>
</head>
<body>

  <div id="info-box">
    <div id="next-step">Klicke unten zum Starten</div>
    <div id="progress">Bereit zur Austragung</div>
    <button id="confirm-btn" onclick="nextWaypoint()">Route Starten / Weiter ➔</button>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    function makeList(street, start, end, step = 1) {
      const list = [];
      if (start <= end) {
        for (let i = start; i <= end; i += step) list.push({ name: `${street} ${i}`, query: `${street} ${i}, 65479 Raunheim` });
      } else {
        for (let i = start; i >= end; i -= step) list.push({ name: `${street} ${i}`, query: `${street} ${i}, 65479 Raunheim` });
      }
      return list;
    }

    // Optimierter Laufweg ohne unnötiges Hin- und Herlaufen
    const waypoints = [
      { name: "Start: Ringstraße 57", query: "Ringstraße 57, 65479 Raunheim" },

      // 1. Ringstraße (56 -> 70, gerade)
      ...makeList("Ringstraße", 56, 70, 2),

      // 2. Oderstraße (1 -> 73)
      ...makeList("Oderstraße", 1, 73, 1),

      // 3. Moselstraße (1-11, 13-14, 18-22)
      ...makeList("Moselstraße", 1, 11, 1),
      ...makeList("Moselstraße", 13, 14, 1),
      ...makeList("Moselstraße", 18, 22, 1),

      // 4. Aussiger Straße (1-18, 20-22)
      ...makeList("Aussiger Straße", 1, 18, 1),
      ...makeList("Aussiger Straße", 20, 22, 1),

      // 5. Jakobstraße (48 -> 52)
      ...makeList("Jakobstraße", 48, 52, 1),

      // 6. Ringstraße (72 -> 122, gerade)
      ...makeList("Ringstraße", 72, 122, 2),

      { name: "Ziel erreicht! Wieder Zuhause.", query: "Ringstraße 57, 65479 Raunheim" }
    ];

    let currentStep = -1;
    let map, userMarker, targetMarker;
    let speechSynth = window.speechSynthesis;

    function initMap() {
      map = L.map('map').setView([50.0105, 8.4410], 18);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      startGPS();
    }

    function startGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;

            if (!userMarker) {
              userMarker = L.circleMarker([lat, lng], {
                color: '#1d4ed8',
                fillColor: '#3b82f6',
                fillOpacity: 0.9,
                radius: 9
              }).addTo(map).bindPopup("Dein Standort");
            } else {
              userMarker.setLatLng([lat, lng]);
            }
          },
          (err) => console.log("GPS Suche..."),
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
      }
    }

    function speak(text) {
      if (speechSynth) {
        speechSynth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'de-DE';
        speechSynth.speak(utterance);
      }
    }

    async function nextWaypoint() {
      if (currentStep < waypoints.length - 1) {
        currentStep++;
        const point = waypoints[currentStep];

        document.getElementById('next-step').innerText = point.name;
        document.getElementById('progress').innerText = `Haus ${currentStep + 1} von ${waypoints.length}`;
        speak(point.name);

        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(point.query)}`);
          const data = await res.json();

          if (data && data.length > 0) {
            const lat = parseFloat(data[0].lat);
            const lng = parseFloat(data[0].lon);

            if (targetMarker) map.removeLayer(targetMarker);
            targetMarker = L.marker([lat, lng]).addTo(map).bindPopup(point.name).openPopup();

            map.setView([lat, lng], 18);
          }
        } catch (e) {
          console.error("Geocoding Fehler", e);
        }
      }
    }

    window.onload = initMap;
  </script>
</body>
</html>
