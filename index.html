<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeitung Austragen - Raunheim Route v17</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #090d16;
      --bg-card: rgba(15, 23, 42, 0.9);
      --bg-card-solid: #0f172a;
      --accent: #00f2fe;
      --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.6);
    }

    * { box-sizing: border-box; }
    body { 
      margin: 0; 
      padding: 0; 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
      background-color: var(--bg-main);
      color: var(--text-main);
      overflow: hidden;
    }

    #info-box { 
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px; 
      z-index: 1000; 
      max-height: 52vh; 
      overflow-y: auto; 
      box-shadow: var(--shadow);
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    #progress { 
      font-size: 0.75rem; 
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent); 
    }

    #mode-badge {
      font-size: 0.7rem;
      font-weight: 700;
      background: rgba(0, 242, 254, 0.15);
      color: var(--accent);
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid rgba(0, 242, 254, 0.4);
      display: none;
    }
    #mode-badge.active { display: inline-block; animation: pulse 1.5s infinite; }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.97); }
      100% { opacity: 1; transform: scale(1); }
    }

    #next-step { 
      font-size: 1.25rem; 
      font-weight: 800; 
      margin-bottom: 8px; 
      color: #fff; 
      letter-spacing: -0.01em;
    }

    #note-display { 
      font-size: 0.85rem; 
      margin-bottom: 12px; 
      text-align: left; 
      background: rgba(5, 8, 15, 0.7); 
      border: 1px solid var(--border);
      padding: 10px 12px; 
      border-radius: 12px; 
      max-height: 90px; 
      overflow-y: auto; 
    }

    .party-item { 
      padding: 4px 0; 
      border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .party-item:last-child { border-bottom: none; }

    .btn-group { 
      display: flex; 
      gap: 10px; 
      justify-content: center; 
      width: 100%; 
      margin: 0 auto 10px auto; 
    }
    
    .nav-btn { 
      flex: 1; 
      padding: 13px; 
      font-size: 0.95rem; 
      border-radius: 14px; 
      border: none; 
      font-weight: 800; 
      cursor: pointer; 
      color: white; 
      touch-action: manipulation; 
      transition: transform 0.1s ease, filter 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .nav-btn:active { transform: scale(0.97); }
    #prev-btn { background: #1e293b; border: 1px solid var(--border); color: var(--text-muted); }
    #prev-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    #next-btn { background: var(--accent-gradient); color: #090d16; }
    #next-btn:disabled { background: #1e293b; color: var(--text-muted); cursor: not-allowed; }

    .toolbar {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tool-btn:hover { background: rgba(255, 255, 255, 0.08); }
    .tool-btn.highlight { border-color: rgba(0, 242, 254, 0.4); color: var(--accent); }
    .tool-btn.active-pin-mode { background: var(--accent-gradient); color: #090d16; font-weight: 800; border-color: transparent; box-shadow: 0 0 15px rgba(0,242,254,0.4); }

    .note-actions { 
      display: flex; 
      gap: 6px; 
      justify-content: center; 
      margin-bottom: 6px; 
      flex-wrap: wrap; 
    }
    
    .note-btn { 
      background: rgba(255, 255, 255, 0.04); 
      color: var(--text-main); 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      padding: 7px 12px; 
      font-size: 0.75rem; 
      font-weight: 600;
      cursor: pointer; 
      transition: background 0.2s;
    }
    .note-btn.no { background: rgba(244, 63, 94, 0.15); border-color: rgba(244, 63, 94, 0.4); color: #fda4af; }
    .note-btn.yes { background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.4); color: #6ee7b7; }

    .footer-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }

    #reset-btn { 
      background: transparent; 
      color: var(--text-muted); 
      border: none; 
      font-size: 0.7rem; 
      cursor: pointer; 
      font-weight: 500;
    }
    #reset-btn:hover { color: var(--text-main); text-decoration: underline; }

    #map { flex: 1; width: 100%; z-index: 1; background-color: #090d16; }

    /* Custom Leaflet Dark Filter Overrides (Macht Standardkacheln dunkel ohne API-Key) */
    .leaflet-tile {
      filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3);
    }

    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: var(--bg-card-solid) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }
    .leaflet-container { font-family: 'Plus Jakarta Sans', sans-serif !important; }
  </style>
</head>
<body>

  <div id="info-box">
    <div class="header-row">
      <div id="progress">Lade Stationen...</div>
      <div id="mode-badge">📍 Tippe auf die echte Position!</div>
    </div>
    
    <div id="next-step">Route wird initialisiert</div>
    <div id="note-display"><span style='color: var(--text-muted);'>Keine Parteien-Notizen hinterlegt.</span></div>
    
    <div class="btn-group">
      <button id="prev-btn" class="nav-btn" type="button" onclick="prevWaypoint()" disabled>⬅ Zurück</button>
      <button id="next-btn" class="nav-btn" type="button" onclick="nextWaypoint()">Weiter ➔</button>
    </div>

    <!-- Werkzeugleiste -->
    <div class="toolbar">
      <button class="tool-btn" type="button" onclick="moveCurrentWaypoint(-1)">⬆ Vorziehen</button>
      <button class="tool-btn" type="button" onclick="moveCurrentWaypoint(1)">⬇ Nach hinten</button>
      <button id="pin-mode-btn" class="tool-btn highlight" type="button" onclick="togglePinMode()">📍 Pin korrigieren</button>
    </div>

    <div class="note-actions">
      <button class="note-btn no" type="button" onclick="addPartyNote('🚫 Partei: Keine Werbung')">+ 🚫 Keine Werbung</button>
      <button class="note-btn yes" type="button" onclick="addPartyNote('📬 Partei: Werbung OK')">+ 📬 Werbung OK</button>
      <button class="note-btn" type="button" onclick="clearCurrentNotes()">🗑️ Löschen</button>
    </div>
    
    <div class="footer-options">
      <button id="reset-btn" type="button" onclick="clearRouteCache()">Standard-Route wiederherstellen</button>
      <span style="font-size: 0.7rem; color: var(--text-muted);">Raunheim v17</span>
    </div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, userMarker, targetMarker;
    let waypoints = [];
    let currentStep = 0;
    let customNotes = {};
    let customCoords = {};
    let isPinCorrectionMode = false;

    const deliveryPlan = [
      { street: "Ringstraße", nums: [57] },
      { street: "Moselstraße", nums: [5, 3, 9, 7, 13, 18, 16, 14, 12, 10, 20, 22, 11] },
      { street: "Aussiger Straße", nums: [22, 20, 18, 16, 14, 12, 10, 8, 6, 4, 2, 1, 3, 5, 7, 9, 11, 13, 15, 17] },
      { street: "Jakobstraße", nums: [52, 50, 48] },
      { street: "Moselstraße", nums: [2, 4, 6, 8] },
      { street: "Ringstraße", nums: [62, 60, 58, 56, 64, 66, 68, 70, 78, 76, 74, 72] },
      { street: "Moselstraße", nums: [1] },
      { street: "Oderstraße", nums: [4, 2] },
      { street: "Ringstraße", nums: [80, 82, 84, 86, 88, 90, 92, 94, 96, 98] },
      { street: "Oderstraße", nums: [39, 41, 43, 45, 47, 49, 51, 53, 57, 59, 37, 35, 33, 31, 29, 27, 25, 23, 21] },
      { street: "Ringstraße", nums: [112, 110, 108, 106, 104, 102, 100] },
      { street: "Oderstraße", nums: [3, 5, 7, 9, 11, 13, 15, 17, 19, 1] },
      { street: "Ringstraße", nums: [118, 116, 122, 120] },
      { street: "Ringstraße", nums: [57] }
    ];

    function cleanStreet(str) {
      return str.toLowerCase()
        .replace(/straße/g, "str")
        .replace(/strasse/g, "str")
        .replace(/\./g, "")
        .replace(/\s+/g, "");
    }

    async function loadRouteData() {
      const savedNotes = localStorage.getItem('raunheim_route_parties_v17');
      if (savedNotes) customNotes = JSON.parse(savedNotes);

      const savedCoords = localStorage.getItem('raunheim_custom_coords_v17');
      if (savedCoords) customCoords = JSON.parse(savedCoords);

      const savedWaypoints = localStorage.getItem('raunheim_custom_waypoints_v17');
      if (savedWaypoints) {
        waypoints = JSON.parse(savedWaypoints);
        applyCustomCoordsToWaypoints();
        startApp();
        return;
      }

      document.getElementById('next-step').innerText = "Verbinde mit Kartendaten...";
      document.getElementById('progress').innerText = "OpenStreetMap sync";

      const overpassQuery = `
        [out:json][timeout:25];
        area["postal_code"="65479"]->.a;
        (
          node["addr:street"]["addr:housenumber"](area.a);
          way["addr:street"]["addr:housenumber"](area.a);
          relation["addr:street"]["addr:housenumber"](area.a);
        );
        out center;
      `;

      try {
        const response = await fetch("https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(overpassQuery));
        const data = await response.json();

        const osmMap = {};
        data.elements.forEach(el => {
          const st = el.tags?.['addr:street'];
          const hnRaw = el.tags?.['addr:housenumber'];
          const hn = parseInt(hnRaw, 10);
          const lat = el.lat || el.center?.lat;
          const lng = el.lon || el.center?.lon;

          if (st && !isNaN(hn) && lat && lng) {
            const key = cleanStreet(st);
            if (!osmMap[key]) osmMap[key] = {};
            if (!osmMap[key][hn]) {
              osmMap[key][hn] = { lat: Number(lat.toFixed(6)), lng: Number(lng.toFixed(6)) };
            }
          }
        });

        buildExactWaypoints(osmMap);
      } catch (err) {
        document.getElementById('next-step').innerText = "Fehler beim Laden!";
        document.getElementById('progress').innerText = "Netzwerk prüfen";
      }
    }

    function getHouseCoordinates(streetMap, num) {
      if (streetMap[num]) return streetMap[num];

      const knownNums = Object.keys(streetMap).map(Number).sort((a, b) => a - b);
      if (knownNums.length === 0) return { lat: 50.0145, lng: 8.4440 };
      if (knownNums.length === 1) return streetMap[knownNums[0]];

      let lower = null, higher = null;
      for (let n of knownNums) {
        if (n < num) lower = n;
        if (n > num && higher === null) higher = n;
      }

      if (lower !== null && higher !== null) {
        const t = (num - lower) / (higher - lower);
        const p1 = streetMap[lower];
        const p2 = streetMap[higher];
        return {
          lat: Number((p1.lat + t * (p2.lat - p1.lat)).toFixed(6)),
          lng: Number((p1.lng + t * (p2.lng - p1.lng)).toFixed(6))
        };
      }

      if (lower === null && higher !== null) return streetMap[higher];
      if (lower !== null && higher === null) return streetMap[lower];

      return { lat: 50.0145, lng: 8.4440 };
    }

    function buildExactWaypoints(osmMap) {
      waypoints = [];

      deliveryPlan.forEach(section => {
        const sKey = cleanStreet(section.street);
        const streetMap = osmMap[sKey] || {};

        section.nums.forEach(num => {
          const coords = getHouseCoordinates(streetMap, num);
          const label = (num === 57 && section.nums.length === 1 && waypoints.length > 0) 
            ? "Ziel erreicht! Wieder Zuhause." 
            : `${section.street} ${num}`;

          const keyId = `${section.street}_${num}_` + Math.random().toString(36).substr(2, 5);
          waypoints.push({ id: keyId, street: section.street, num: num, name: label, lat: coords.lat, lng: coords.lng });
        });
      });

      applyCustomCoordsToWaypoints();
      localStorage.setItem('raunheim_custom_waypoints_v17', JSON.stringify(waypoints));
      startApp();
    }

    function applyCustomCoordsToWaypoints() {
      waypoints.forEach(wp => {
        const coordinateKey = `${wp.street}_${wp.num}`;
        if (customCoords[coordinateKey]) {
          wp.lat = customCoords[coordinateKey].lat;
          wp.lng = customCoords[coordinateKey].lng;
        }
      });
    }

    function startApp() {
      if (waypoints.length > 0) {
        showStep(0);
      }
    }

    function showStep(index) {
      if (index < 0 || index >= waypoints.length) return;

      currentStep = index;
      const item = waypoints[currentStep];

      document.getElementById('next-step').innerText = item.name;
      document.getElementById('progress').innerText = `Station ${currentStep + 1} von ${waypoints.length}`;
      
      const noteEl = document.getElementById('note-display');
      const parties = customNotes[item.id] || [];

      if (parties.length > 0) {
        let html = "";
        parties.forEach((p, idx) => {
          html += `<div class="party-item"><span>${p}</span> <button onclick="removePartyNote(${idx})" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:0.7rem;">✕</button></div>`;
        });
        noteEl.innerHTML = html;
      } else {
        noteEl.innerHTML = "<span style='color: var(--text-muted);'>Keine Parteien-Notizen hinterlegt.</span>";
      }

      speak(item.name);

      if (targetMarker) map.removeLayer(targetMarker);
      
      targetMarker = L.marker([item.lat, item.lng]).addTo(map).bindPopup(item.name).openPopup();
      map.setView([item.lat, item.lng], 18);
      
      if (isPinCorrectionMode) {
        togglePinMode();
      }

      document.getElementById('prev-btn').disabled = (currentStep === 0);
      document.getElementById('next-btn').disabled = (currentStep === waypoints.length - 1);
    }

    function togglePinMode() {
      isPinCorrectionMode = !isPinCorrectionMode;
      const btn = document.getElementById('pin-mode-btn');
      const badge = document.getElementById('mode-badge');
      
      if (isPinCorrectionMode) {
        btn.classList.add('active-pin-mode');
        badge.classList.add('active');
      } else {
        btn.classList.remove('active-pin-mode');
        badge.classList.remove('active');
      }
    }

    function moveCurrentWaypoint(direction) {
      const targetIndex = currentStep + direction;
      if (targetIndex < 0 || targetIndex >= waypoints.length) return;

      const item = waypoints.splice(currentStep, 1)[0];
      waypoints.splice(targetIndex, 0, item);

      localStorage.setItem('raunheim_custom_waypoints_v17', JSON.stringify(waypoints));
      showStep(targetIndex);
    }

    function addPartyNote(noteText) {
      const item = waypoints[currentStep];
      if (!item) return;

      if (!customNotes[item.id]) customNotes[item.id] = [];
      
      const partyNum = customNotes[item.id].length + 1;
      customNotes[item.id].push(`Partei ${partyNum}: ${noteText.replace('Partei: ', '')}`);

      localStorage.setItem('raunheim_route_parties_v17', JSON.stringify(customNotes));
      showStep(currentStep);
    }

    function removePartyNote(index) {
      const item = waypoints[currentStep];
      if (!item || !customNotes[item.id]) return;

      customNotes[item.id].splice(index, 1);
      if (customNotes[item.id].length === 0) delete customNotes[item.id];

      localStorage.setItem('raunheim_route_parties_v17', JSON.stringify(customNotes));
      showStep(currentStep);
    }

    function clearCurrentNotes() {
      const item = waypoints[currentStep];
      if (!item) return;

      delete customNotes[item.id];
      localStorage.setItem('raunheim_route_parties_v17', JSON.stringify(customNotes));
      showStep(currentStep);
    }

    function nextWaypoint() {
      if (currentStep < waypoints.length - 1) showStep(currentStep + 1);
    }

    function prevWaypoint() {
      if (currentStep > 0) showStep(currentStep - 1);
    }

    function clearRouteCache() {
      localStorage.removeItem('raunheim_custom_waypoints_v17');
      localStorage.removeItem('raunheim_route_parties_v17');
      localStorage.removeItem('raunheim_custom_coords_v17');
      location.reload();
    }

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([50.0145, 8.4440], 18);
      L.control.zoom({ position: 'bottomright' }).addTo(map);

      // Kostenlose Standard-OpenStreetMap-Kacheln (mit CSS-Darkmode-Filter)
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap',
        maxZoom: 19
      }).addTo(map);

      // Klick-Event zum Korrigieren der Position
      map.on('click', function(e) {
        if (!isPinCorrectionMode) return;
        
        const item = waypoints[currentStep];
        if (!item) return;

        item.lat = Number(e.latlng.lat.toFixed(6));
        item.lng = Number(e.latlng.lng.toFixed(6));

        const coordKey = `${item.street}_${item.num}`;
        customCoords[coordKey] = { lat: item.lat, lng: item.lng };
        localStorage.setItem('raunheim_custom_coords_v17', JSON.stringify(customCoords));
        localStorage.setItem('raunheim_custom_waypoints_v17', JSON.stringify(waypoints));

        showStep(currentStep);
      });

      startGPS();
      loadRouteData();
    }

    function startGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;

            if (!userMarker) {
              userMarker = L.circleMarker([lat, lng], {
                color: '#00f2fe',
                fillColor: '#00f2fe',
                fillOpacity: 0.9,
                radius: 8,
                weight: 3
              }).addTo(map).bindPopup("Dein Standort");
            } else {
              userMarker.setLatLng([lat, lng]);
            }
          },
          (err) => console.log("GPS Status..."),
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
      }
    }

    function speak(text) {
      try {
        if ('speechSynthesis' in window && window.speechSynthesis) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'de-DE';
          window.speechSynthesis.speak(utterance);
        }
      } catch (e) {
        console.log("Sprachausgabe:", e);
      }
    }

    window.onload = initMap;
  </script>
</body>
</html>
