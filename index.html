<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeitung Austragen - Raunheim Route v15</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #info-box { background: #1e293b; color: white; padding: 12px 15px; text-align: center; z-index: 1000; max-height: 48vh; overflow-y: auto; }
    #next-step { font-size: 1.1rem; font-weight: bold; margin-bottom: 2px; color: #facc15; }
    #note-display { font-size: 0.85rem; margin-bottom: 8px; text-align: left; background: #334155; padding: 8px; border-radius: 6px; max-height: 80px; overflow-y: auto; }
    .party-item { padding: 3px 0; border-bottom: 1px solid #475569; display: flex; justify-content: space-between; align-items: center; }
    .party-item:last-child { border-bottom: none; }
    #progress { font-size: 0.75rem; color: #94a3b8; margin-bottom: 6px; }
    .btn-group { display: flex; gap: 8px; justify-content: center; width: 100%; max-width: 360px; margin: 0 auto 6px auto; }
    .nav-btn { flex: 1; padding: 10px; font-size: 0.95rem; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; color: white; touch-action: manipulation; }
    #prev-btn { background: #475569; }
    #prev-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    #next-btn { background: #16a34a; }
    #next-btn:disabled { background: #475569; cursor: not-allowed; }
    .route-edit-group { display: flex; gap: 5px; justify-content: center; margin-bottom: 6px; }
    .edit-btn { background: #334155; color: #facc15; border: 1px solid #475569; border-radius: 6px; padding: 5px 10px; font-size: 0.75rem; cursor: pointer; font-weight: bold; }
    .note-actions { display: flex; gap: 5px; justify-content: center; margin-bottom: 4px; flex-wrap: wrap; }
    .note-btn { background: #334155; color: white; border: 1px solid #475569; border-radius: 6px; padding: 5px 8px; font-size: 0.7rem; cursor: pointer; }
    .note-btn.no { background: #dc2626; border-color: #ef4444; }
    .note-btn.yes { background: #16a34a; border-color: #22c55e; }
    #map { flex: 1; width: 100%; }
    #reset-btn { background: transparent; color: #64748b; border: none; font-size: 0.7rem; text-decoration: underline; margin-top: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <div id="info-box">
    <div id="next-step">Lade Gebäude-Koordinaten...</div>
    <div id="note-display">Keine Notizen für Parteien hinterlegt.</div>
    <div id="progress">Bitte einen Moment Geduld</div>
    
    <div class="btn-group">
      <button id="prev-btn" class="nav-btn" type="button" onclick="prevWaypoint()" disabled>⬅ Zurück</button>
      <button id="next-btn" class="nav-btn" type="button" onclick="nextWaypoint()">Weiter ➔</button>
    </div>

    <!-- Steuerung zum Verschieben der aktuellen Station -->
    <div class="route-edit-group">
      <button class="edit-btn" type="button" onclick="moveCurrentWaypoint(-1)">⬆ Station vorziehen</button>
      <button class="edit-btn" type="button" onclick="moveCurrentWaypoint(1)">⬇ Station nach hinten</button>
    </div>

    <div class="note-actions">
      <button class="note-btn no" type="button" onclick="addPartyNote('🚫 Partei: Keine Werbung')">+ 🚫 Partei (Keine Werbung)</button>
      <button class="note-btn yes" type="button" onclick="addPartyNote('📬 Partei: Werbung OK')">+ 📬 Partei (Werbung)</button>
      <button class="note-btn" type="button" onclick="clearCurrentNotes()">🗑️ Notizen löschen</button>
    </div>
    <div><button id="reset-btn" type="button" onclick="clearRouteCache()">Standard-Route wiederherstellen</button></div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, userMarker, targetMarker;
    let waypoints = [];
    let currentStep = 0;
    let customNotes = {};

    const deliveryPlan = [
      { street: "Ringstraße", nums: [57] },
      { street: "Moselstraße", nums: [5, 3, 9, 7, 13, 18, 16, 14, 12, 10, 20, 22, 11] },
      { street: "Aussiger Straße", nums: [22, 20, 18, 16, 14, 12, 10, 8, 6, 4, 2, 1, 3, 5, 7, 9, 11, 13, 15, 17] },
      { street: "Jakobstraße", nums: [52, 50, 48] },
      { street: "Moselstraße", nums: [2, 4, 6, 8] },
      { street: "Ringstraße", nums: [62, 60, 58, 56, 64, 66, 68, 70, 78, 76, 74, 72] },
      { street: "Moselstraße", nums: [1] },
      { street: "Oderstraße", nums: [4, 2] },
      { street: "Ringstraße", nums: [80, 82, 84, 86, 88, 90, 92, 94, 96, 98] },
      { street: "Oderstraße", nums: [39, 41, 43, 45, 47, 49, 51, 53, 57, 59, 37, 35, 33, 31, 29, 27, 25, 23, 21] },
      { street: "Ringstraße", nums: [112, 110, 108, 106, 104, 102, 100] },
      { street: "Oderstraße", nums: [3, 5, 7, 9, 11, 13, 15, 17, 19, 1] },
      { street: "Ringstraße", nums: [118, 116, 122, 120] },
      { street: "Ringstraße", nums: [57] }
    ];

    function cleanStreet(str) {
      return str.toLowerCase()
        .replace(/straße/g, "str")
        .replace(/strasse/g, "str")
        .replace(/\./g, "")
        .replace(/\s+/g, "");
    }

    async function loadRouteData() {
      const savedNotes = localStorage.getItem('raunheim_route_parties_v15');
      if (savedNotes) {
        customNotes = JSON.parse(savedNotes);
      }

      // Prüfen ob eine veränderte Reihenfolge gespeichert ist
      const savedWaypoints = localStorage.getItem('raunheim_custom_waypoints_v15');
      if (savedWaypoints) {
        waypoints = JSON.parse(savedWaypoints);
        startApp();
        return;
      }

      document.getElementById('next-step').innerText = "Rufe reale Standorte ab...";
      document.getElementById('progress').innerText = "Verbindung zu OpenStreetMap...";

      const overpassQuery = `
        [out:json][timeout:25];
        area["postal_code"="65479"]->.a;
        (
          node["addr:street"]["addr:housenumber"](area.a);
          way["addr:street"]["addr:housenumber"](area.a);
          relation["addr:street"]["addr:housenumber"](area.a);
        );
        out center;
      `;

      try {
        const response = await fetch("https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(overpassQuery));
        const data = await response.json();

        const osmMap = {};
        data.elements.forEach(el => {
          const st = el.tags?.['addr:street'];
          const hnRaw = el.tags?.['addr:housenumber'];
          const hn = parseInt(hnRaw, 10);
          const lat = el.lat || el.center?.lat;
          const lng = el.lon || el.center?.lon;

          if (st && !isNaN(hn) && lat && lng) {
            const key = cleanStreet(st);
            if (!osmMap[key]) osmMap[key] = {};
            if (!osmMap[key][hn]) {
              osmMap[key][hn] = { lat: Number(lat.toFixed(6)), lng: Number(lng.toFixed(6)) };
            }
          }
        });

        buildExactWaypoints(osmMap);
      } catch (err) {
        document.getElementById('next-step').innerText = "Netzwerkfehler beim Laden!";
        document.getElementById('progress').innerText = "Bitte Seite neu laden.";
      }
    }

    function getHouseCoordinates(streetMap, num) {
      if (streetMap[num]) return streetMap[num];

      const knownNums = Object.keys(streetMap).map(Number).sort((a, b) => a - b);
      if (knownNums.length === 0) return { lat: 50.0145, lng: 8.4440 };
      if (knownNums.length === 1) return streetMap[knownNums[0]];

      let lower = null, higher = null;
      for (let n of knownNums) {
        if (n < num) lower = n;
        if (n > num && higher === null) higher = n;
      }

      if (lower !== null && higher !== null) {
        const t = (num - lower) / (higher - lower);
        const p1 = streetMap[lower];
        const p2 = streetMap[higher];
        return {
          lat: Number((p1.lat + t * (p2.lat - p1.lat)).toFixed(6)),
          lng: Number((p1.lng + t * (p2.lng - p1.lng)).toFixed(6))
        };
      }

      if (lower === null && higher !== null) return streetMap[higher];
      if (lower !== null && higher === null) return streetMap[lower];

      return { lat: 50.0145, lng: 8.4440 };
    }

    function buildExactWaypoints(osmMap) {
      waypoints = [];

      deliveryPlan.forEach(section => {
        const sKey = cleanStreet(section.street);
        const streetMap = osmMap[sKey] || {};

        section.nums.forEach(num => {
          const coords = getHouseCoordinates(streetMap, num);
          const label = (num === 57 && section.nums.length === 1 && waypoints.length > 0) 
            ? "Ziel erreicht! Wieder Zuhause." 
            : `${section.street} ${num}`;

          const keyId = `${section.street}_${num}_` + Math.random().toString(36).substr(2, 5);
          waypoints.push({ id: keyId, name: label, lat: coords.lat, lng: coords.lng });
        });
      });

      localStorage.setItem('raunheim_custom_waypoints_v15', JSON.stringify(waypoints));
      startApp();
    }

    function startApp() {
      if (waypoints.length > 0) {
        showStep(0);
      }
    }

    function showStep(index) {
      if (index < 0 || index >= waypoints.length) return;

      currentStep = index;
      const item = waypoints[currentStep];

      document.getElementById('next-step').innerText = item.name;
      document.getElementById('progress').innerText = `Station ${currentStep + 1} von ${waypoints.length}`;
      
      const noteEl = document.getElementById('note-display');
      const parties = customNotes[item.id] || [];

      if (parties.length > 0) {
        let html = "";
        parties.forEach((p, idx) => {
          html += `<div class="party-item"><span>${p}</span> <button onclick="removePartyNote(${idx})" style="background:none; border:none; color:#94a3b8; cursor:pointer; font-size:0.7rem;">✕ löschen</button></div>`;
        });
        noteEl.innerHTML = html;
      } else {
        noteEl.innerHTML = "<span style='color: #94a3b8;'>Keine Parteien-Notizen hinterlegt.</span>";
      }

      speak(item.name);

      if (targetMarker) map.removeLayer(targetMarker);
      
      targetMarker = L.marker([item.lat, item.lng]).addTo(map).bindPopup(item.name).openPopup();
      map.setView([item.lat, item.lng], 18);

      document.getElementById('prev-btn').disabled = (currentStep === 0);
      document.getElementById('next-btn').disabled = (currentStep === waypoints.length - 1);
    }

    function moveCurrentWaypoint(direction) {
      const targetIndex = currentStep + direction;
      if (targetIndex < 0 || targetIndex >= waypoints.length) return;

      // Element im Array verschieben
      const item = waypoints.splice(currentStep, 1)[0];
      waypoints.splice(targetIndex, 0, item);

      // Neue Reihenfolge speichern
      localStorage.setItem('raunheim_custom_waypoints_v15', JSON.stringify(waypoints));

      // Zu neuer Position springen
      showStep(targetIndex);
    }

    function addPartyNote(noteText) {
      const item = waypoints[currentStep];
      if (!item) return;

      if (!customNotes[item.id]) {
        customNotes[item.id] = [];
      }
      
      const partyNum = customNotes[item.id].length + 1;
      customNotes[item.id].push(`Partei ${partyNum}: ${noteText.replace('Partei: ', '')}`);

      localStorage.setItem('raunheim_route_parties_v15', JSON.stringify(customNotes));
      showStep(currentStep);
    }

    function removePartyNote(index) {
      const item = waypoints[currentStep];
      if (!item || !customNotes[item.id]) return;

      customNotes[item.id].splice(index, 1);
      if (customNotes[item.id].length === 0) {
        delete customNotes[item.id];
      }

      localStorage.setItem('raunheim_route_parties_v15', JSON.stringify(customNotes));
      showStep(currentStep);
    }

    function clearCurrentNotes() {
      const item = waypoints[currentStep];
      if (!item) return;

      delete customNotes[item.id];
      localStorage.setItem('raunheim_route_parties_v15', JSON.stringify(customNotes));
      showStep(currentStep);
    }

    function nextWaypoint() {
      if (currentStep < waypoints.length - 1) {
        showStep(currentStep + 1);
      }
    }

    function prevWaypoint() {
      if (currentStep > 0) {
        showStep(currentStep - 1);
      }
    }

    function clearRouteCache() {
      localStorage.removeItem('raunheim_custom_waypoints_v15');
      localStorage.removeItem('raunheim_route_parties_v15');
      location.reload();
    }

    function initMap() {
      map = L.map('map').setView([50.0145, 8.4440], 18);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      startGPS();
      loadRouteData();
    }

    function startGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;

            if (!userMarker) {
              userMarker = L.circleMarker([lat, lng], {
                color: '#1d4ed8',
                fillColor: '#3b82f6',
                fillOpacity: 0.9,
                radius: 9
              }).addTo(map).bindPopup("Dein Standort");
            } else {
              userMarker.setLatLng([lat, lng]);
            }
          },
          (err) => console.log("GPS..."),
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
      }
    }

    function speak(text) {
      try {
        if ('speechSynthesis' in window && window.speechSynthesis) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'de-DE';
          window.speechSynthesis.speak(utterance);
        }
      } catch (e) {
        console.log("Sprachausgabe Fehler:", e);
      }
    }

    window.onload = initMap;
  </script>
</body>
</html>
