<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeitung Austragen - Raunheim</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #info-box { background: #1e293b; color: white; padding: 15px; text-align: center; z-index: 1000; }
    #next-step { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; color: #facc15; }
    #progress { font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px; }
    #confirm-btn { background: #16a34a; color: white; border: none; padding: 14px 20px; font-size: 1.1rem; border-radius: 8px; width: 100%; max-width: 320px; font-weight: bold; cursor: pointer; }
    #confirm-btn:active { background: #15803d; }
    #confirm-btn:disabled { background: #475569; cursor: not-allowed; }
    #map { flex: 1; width: 100%; }
  </style>
</head>
<body>

  <div id="info-box">
    <div id="next-step">Lade Routendaten...</div>
    <div id="progress">Bitte kurz warten</div>
    <button id="confirm-btn" onclick="nextWaypoint()" disabled>Lade Route...</button>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Liste der Stationen mit exakten Adressangaben für Raunheim
    const waypointsRaw = [
      { name: "Start: Ringstraße 57", query: "Ringstraße 57, 65479 Raunheim" },
      { name: "1. Ringstraße Hnr. 56 bis 70", query: "Ringstraße 60, 65479 Raunheim" },
      { name: "2. Oderstraße Hnr. 1 bis 73", query: "Oderstraße 1, 65479 Raunheim" },
      { name: "3. Moselstraße Hnr. 1 bis 22", query: "Moselstraße 1, 65479 Raunheim" },
      { name: "4. Aussiger Straße Hnr. 1 bis 22", query: "Aussiger Straße 1, 65479 Raunheim" },
      { name: "5. Jakobstraße Hnr. 48 bis 52", query: "Jakobstraße 48, 65479 Raunheim" },
      { name: "6. Ringstraße Hnr. 72 bis 122", query: "Ringstraße 80, 65479 Raunheim" },
      { name: "Ziel erreicht! Wieder Zuhause.", query: "Ringstraße 57, 65479 Raunheim" }
    ];

    let waypoints = [];
    let currentStep = -1;
    let map, userMarker, targetMarker;
    let speechSynth = window.speechSynthesis;

    async function initMap() {
      // Karte um Raunheim initialisieren
      map = L.map('map').setView([50.012, 8.450], 16);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      startGPS();
      await loadCoordinates();
    }

    // Lädt die Koordinaten zuverlässig im Voraus
    async function loadCoordinates() {
      for (let i = 0; i < waypointsRaw.length; i++) {
        const item = waypointsRaw[i];
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(item.query)}`);
          const data = await res.json();
          if (data && data.length > 0) {
            waypoints.push({
              name: item.name,
              lat: parseFloat(data[0].lat),
              lng: parseFloat(data[0].lon)
            });
          }
          // Kurze Pause, um den Server nicht zu überlasten
          await new Promise(r => setTimeout(r, 1000));
        } catch (e) {
          console.error("Fehler beim Laden von:", item.name);
        }
      }

      document.getElementById('next-step').innerText = "Route bereit!";
      document.getElementById('progress').innerText = "Klicke unten zum Starten";
      const btn = document.getElementById('confirm-btn');
      btn.innerText = "Route Starten / Weiter ➔";
      btn.disabled = false;
    }

    function startGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;

            if (!userMarker) {
              userMarker = L.circleMarker([lat, lng], {
                color: '#1d4ed8',
                fillColor: '#3b82f6',
                fillOpacity: 0.9,
                radius: 9
              }).addTo(map).bindPopup("Dein Standort");
            } else {
              userMarker.setLatLng([lat, lng]);
            }
          },
          (err) => console.log("GPS Suche..."),
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
      }
    }

    function speak(text) {
      if (speechSynth) {
        speechSynth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'de-DE';
        speechSynth.speak(utterance);
      }
    }

    function nextWaypoint() {
      if (currentStep < waypoints.length - 1) {
        currentStep++;
        const point = waypoints[currentStep];

        document.getElementById('next-step').innerText = point.name;
        document.getElementById('progress').innerText = `Station ${currentStep + 1} von ${waypoints.length}`;
        speak(point.name);

        if (targetMarker) map.removeLayer(targetMarker);
        
        targetMarker = L.marker([point.lat, point.lng]).addTo(map).bindPopup(point.name).openPopup();
        map.setView([point.lat, point.lng], 17);
      }
    }

    window.onload = initMap;
  </script>
</body>
</html>
