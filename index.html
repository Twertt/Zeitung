<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeitung Austragen - Raunheim</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    #info-box { background: #1e293b; color: white; padding: 15px; text-align: center; z-index: 1000; }
    #next-step { font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; color: #facc15; }
    #progress { font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px; }
    #confirm-btn { background: #16a34a; color: white; border: none; padding: 14px 20px; font-size: 1.1rem; border-radius: 8px; width: 100%; max-width: 320px; font-weight: bold; cursor: pointer; }
    #confirm-btn:active { background: #15803d; }
    #map { flex: 1; width: 100%; }
  </style>
</head>
<body>

  <div id="info-box">
    <div id="next-step">Klicke unten zum Starten</div>
    <div id="progress">Bereit zur Austragung</div>
    <button id="confirm-btn" onclick="nextWaypoint()">Route Starten / Weiter ➔</button>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Hilfsfunktion zur Erzeugung präziser Punkte entlang einer Straße
    function createSegment(street, numbers, startLat, startLng, endLat, endLng) {
      const count = numbers.length;
      return numbers.map((num, idx) => {
        const t = count > 1 ? idx / (count - 1) : 0;
        return {
          name: `${street} ${num}`,
          lat: Number((startLat + t * (endLat - startLat)).toFixed(6)),
          lng: Number((startLng + t * (endLng - startLng)).toFixed(6))
        };
      });
    }

    function range(start, end, step = 1) {
      const res = [];
      if (start <= end) {
        for (let i = start; i <= end; i += step) res.push(i);
      } else {
        for (let i = start; i >= end; i -= step) res.push(i);
      }
      return res;
    }

    // Fest verankerte Koordinaten im Wohngebiet Raunheim West (PLZ 65479)
    const waypoints = [
      { name: "Start: Ringstraße 57", lat: 50.01300, lng: 8.44450 },

      // 1. Ringstraße (56 bis 70 - gerade Seite)
      ...createSegment("Ringstraße", range(56, 70, 2), 50.01310, 8.44460, 50.01370, 8.44540),

      // 2. Oderstraße: Ungerade hin (1->73), Gerade zurück (72->2)
      ...createSegment("Oderstraße", range(1, 73, 2), 50.01320, 8.44220, 50.01520, 8.44340),
      ...createSegment("Oderstraße", range(72, 2, 2), 50.01522, 8.44360, 50.01322, 8.44240),

      // 3. Moselstraße: Ungerade hin, Gerade zurück
      ...createSegment("Moselstraße", [1, 3, 5, 7, 9, 11, 13, 19, 21], 50.01350, 8.44330, 50.01480, 8.44430),
      ...createSegment("Moselstraße", [22, 20, 18, 14, 10, 8, 6, 4, 2], 50.01482, 8.44450, 50.01352, 8.44350),

      // 4. Aussiger Straße: Ungerade hin, Gerade zurück
      ...createSegment("Aussiger Straße", [1, 3, 5, 7, 9, 11, 13, 15, 17, 21], 50.01380, 8.44460, 50.01500, 8.44560),
      ...createSegment("Aussiger Straße", [22, 20, 18, 16, 14, 12, 10, 8, 6, 4, 2], 50.01502, 8.44580, 50.01382, 8.44480),

      // 5. Jakobstraße (48 bis 52)
      ...createSegment("Jakobstraße", range(48, 52, 1), 50.01340, 8.44570, 50.01380, 8.44630),

      // 6. Ringstraße (72 bis 122 - gerade zurück)
      ...createSegment("Ringstraße", range(72, 122, 2), 50.01370, 8.44540, 50.01250, 8.44410),

      { name: "Ziel erreicht! Wieder Zuhause.", lat: 50.01300, lng: 8.44450 }
    ];

    let currentStep = -1;
    let map, userMarker, targetMarker;
    let speechSynth = window.speechSynthesis;

    function initMap() {
      // Startansicht direkt über dem Viertel
      map = L.map('map').setView([50.01380, 8.44400], 18);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
      }).addTo(map);

      startGPS();
    }

    function startGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;

            if (!userMarker) {
              userMarker = L.circleMarker([lat, lng], {
                color: '#1d4ed8',
                fillColor: '#3b82f6',
                fillOpacity: 0.9,
                radius: 9
              }).addTo(map).bindPopup("Dein Standort");
            } else {
              userMarker.setLatLng([lat, lng]);
            }
          },
          (err) => console.log("GPS..."),
          { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
      }
    }

    function speak(text) {
      if (speechSynth) {
        speechSynth.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'de-DE';
        speechSynth.speak(utterance);
      }
    }

    function nextWaypoint() {
      if (currentStep < waypoints.length - 1) {
        currentStep++;
        const item = waypoints[currentStep];

        document.getElementById('next-step').innerText = item.name;
        document.getElementById('progress').innerText = `Station ${currentStep + 1} von ${waypoints.length}`;
        speak(item.name);

        if (targetMarker) map.removeLayer(targetMarker);
        
        targetMarker = L.marker([item.lat, item.lng]).addTo(map).bindPopup(item.name).openPopup();
        map.setView([item.lat, item.lng], 18);
      }
    }

    window.onload = initMap;
  </script>
</body>
</html>
